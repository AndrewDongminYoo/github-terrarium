name: Collection capability

on:
  push:
    branches: [main, feat/collection-probe]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: Probe public API with the workflow token
        if: github.event_name != 'pull_request' && github.repository == 'AndrewDongminYoo/github-terrarium'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m github_terrarium probe
