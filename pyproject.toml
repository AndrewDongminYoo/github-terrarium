[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "github-terrarium"
version = "0.1.0"
description = "An SVG habitat grown from public GitHub activity"
requires-python = ">=3.12"

[project.scripts]
github-terrarium = "github_terrarium.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
